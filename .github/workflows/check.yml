# Checks of each push and pull request (audit C7): the same script as on the Mac, scripts/check.sh, then a Release
# build. The UI tests are not run: they drive the mouse, and are run by hand at the end of each phase.
name: Vérifications

on:
  # main only: another branch is checked once, by its pull request, not a second time by its pushes. Tags aren't
  # either: a published release runs these checks through release.yml, before building its disk image.
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Read only (review DI5): the checks change nothing in the repository.
permissions:
  contents: read

# A new push cancels the checks of the previous one on the same branch or pull request; never those of a release.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  check:
    # Xcode 27, as on the developers' Macs (review DI6): GitHub's macos-26 machines only have Xcode 26. A preview image,
    # without service agreement; its Xcode is fixed, never “the newest of the machine” (a beta would come in alone).
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      XCODE: /Applications/Xcode_27.1.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Xcode fixé
        run: |
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: SwiftFormat et SwiftLint
        # Fixed versions, from their GitHub releases, checked against their SHA-256 (review DI5): a new version brings
        # new rules, which would fail unchanged code. Same SwiftFormat as `--minversion` in .swiftformat.
        env:
          SWIFTFORMAT_VERSION: 0.64.0
          SWIFTFORMAT_SHA256: 95ea62625d0b898a7af870293311ae6f09e4a3147ecd900593687e4b9ab2fd98
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          shasum -a 256 -c <<SUMS
          $SWIFTFORMAT_SHA256  $RUNNER_TEMP/swiftformat.zip
          $SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip
          SUMS
          unzip -q -o "$RUNNER_TEMP/swiftformat.zip" swiftformat -d "$tools"
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$tools"
          chmod +x "$tools/swiftformat" "$tools/swiftlint"
          echo "$tools" >> "$GITHUB_PATH"
          "$tools/swiftformat" --version
          "$tools/swiftlint" version

      - name: Vérifications
        # No signing team on GitHub's machines: signed to run locally only. The unit tests run one at a time
        # (scripts/check.sh, review TS1). MATCHA_CHECK_RELEASE: the configuration of the published images is built
        # too, without warning (review DI4): an error of its own shows here, not after a release is published.
        env:
          MATCHA_XCODEBUILD_FLAGS: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGNING_REQUIRED=NO
          MATCHA_CHECK_RELEASE: 1
        run: scripts/check.sh

      - name: Journaux
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journaux
          path: |
            build/check
            build/Logs/Test
