# A GitHub release published (by hand, its tag v1.2.0 or v1.2.0-beta.1): the checks of check.yml, then a universal
# disk image signed ad hoc (scripts/package.sh), added with its SHA-256 to that release. The release itself (title,
# notes) is left as it is. Neither signed by Apple nor notarized: macOS asks to confirm the first opening. The signed
# and notarized path, with Developer ID, is scripts/release.sh, run on a Mac that has the certificate.
name: Image disque

on:
  release:
    types: [published]

jobs:
  check:
    uses: ./.github/workflows/check.yml

  package:
    needs: check
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      # Adding the files to the release.
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number counts the commits.
          fetch-depth: 0

      - name: Xcode le plus récent de la machine
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Image disque
        run: scripts/package.sh "${TAG#v}"

      - name: Ajout à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          dmg="build/package/$version/Matcha-$version.dmg"
          # --clobber: a release published again gets the new image in place of the old one.
          gh release upload "$TAG" "$dmg" "$dmg.sha256" --clobber

      - name: Journaux
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-image-disque
          path: |
            build/package/*/build.log
            build/package/*/hdiutil.log
