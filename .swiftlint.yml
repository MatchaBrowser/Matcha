included:
  - Matcha
  - MatchaTests
  - MatchaUITests

excluded:
  - build
  - DerivedData

# Formatting belongs to SwiftFormat, which adds trailing commas.
disabled_rules:
  - trailing_comma

# Rules added (audit C7). Left out: legacy_objc_type (NSNumber, NSMutableData required by the system's APIs),
# implicitly_unwrapped_optional (WebKit's signatures), discouraged_optional_boolean (three-state booleans).
opt_in_rules:
  - indentation_width
  - force_unwrapping
  - empty_count
  - empty_string
  - first_where
  - last_where
  - contains_over_filter_count
  - contains_over_first_not_nil
  - sorted_first_last
  - redundant_nil_coalescing
  - toggle_bool
  - fatal_error_message
  - unneeded_parentheses_in_closure_argument
  - yoda_condition
  - identical_operands

indentation_width:
  indentation_width: 4

line_length:
  warning: 140
  ignores_comments: true

# “Short files” of CLAUDE.md: about 300 lines, comments not counted.
file_length:
  warning: 300
  ignore_comment_only_lines: true

custom_rules:
  no_print:
    regex: '(?<![\w.])(?<!func )print\('
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "Logger (os.log), jamais print (CLAUDE.md)"
  no_shared_singleton:
    regex: 'static (let|var) shared\b'
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Pas de singleton : les services partagés viennent d'AppEnvironment (CLAUDE.md)"
  # Multiplatform preparation (phase 10): the core and Shared/ use AppKit only in the core's AppKit/ folders, which an
  # iOS app would replace with its own. The types are listed because `import WebKit` and `import SwiftUI` bring AppKit
  # along on the Mac; what the list misses, a build for iOS will show.
  appkit_outside_platform_folders:
    included: '/Matcha/(Browser|Services|Models|Shared)/'
    excluded: '/AppKit/'
    regex: '\bimport (AppKit|Cocoa|IOKit)\b|\bNS(Application|App|Window|WindowController|View|ViewController|ViewRepresentable|ViewControllerRepresentable|HostingView|HostingController|Image|BitmapImageRep|Color|Font|Event|Menu|MenuItem|UserInterfaceItemIdentifier|Workspace|Pasteboard|DraggingInfo|DragOperation|Screen|Cursor|TrackingArea|Panel|Alert|SavePanel|OpenPanel|PrintOperation|PrintInfo|Responder|EdgeInsets|BezierPath|Appearance|Sound|Size|Point|Rect)\b|\bHost\.current\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "AppKit dans le cœur ou Shared/ : le mettre dans un dossier AppKit/ du cœur, derrière un type neutre (CLAUDE.md)"
  # The interface stays in Features/ and App/: each platform draws its own, on the same core and Shared/ logic.
  swiftui_outside_interface:
    included: '/Matcha/(Browser|Services|Models|Shared)/'
    excluded: '/AppKit/'
    regex: '\bimport SwiftUI\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: "SwiftUI hors de l'interface : le cœur et Shared/ restent sans vue, l'interface est dans Features/ et App/ (CLAUDE.md)"
