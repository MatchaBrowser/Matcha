# Checks of each push and pull request (audit C7): the same script as on the Mac, scripts/check.sh. The UI tests are
# not run: they drive the mouse, and are run by hand at the end of each phase.
name: Vérifications

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode le plus récent de la machine
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: SwiftFormat et SwiftLint
        run: brew install swiftformat swiftlint

      - name: Vérifications
        # No signing team on GitHub's machines: signed to run locally only.
        env:
          MATCHA_XCODEBUILD_FLAGS: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGNING_REQUIRED=NO
        run: scripts/check.sh

      - name: Journaux
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journaux
          path: |
            build/check
            build/Logs/Test
