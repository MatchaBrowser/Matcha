# Checks of each push and pull request (audit C7): the same script as on the Mac, scripts/check.sh. The UI tests are
# not run: they drive the mouse, and are run by hand at the end of each phase.
name: Vérifications

on:
  push:
    # Branches only: a version tag runs these checks through release.yml, before building the app.
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Xcode le plus récent de la machine
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: SwiftFormat et SwiftLint
        # Fixed versions, from their GitHub releases: a new version brings new rules, which would fail unchanged code.
        # Same SwiftFormat as `--minversion` in .swiftformat.
        env:
          SWIFTFORMAT_VERSION: 0.64.0
          SWIFTLINT_VERSION: 0.65.1
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          unzip -q -o "$RUNNER_TEMP/swiftformat.zip" swiftformat -d "$tools"
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$tools"
          chmod +x "$tools/swiftformat" "$tools/swiftlint"
          echo "$tools" >> "$GITHUB_PATH"
          "$tools/swiftformat" --version
          "$tools/swiftlint" version

      - name: Vérifications
        # No signing team on GitHub's machines: signed to run locally only.
        # One test at a time: in parallel, hundreds of WebKit tests and their page processes overload the 3 cores and
        # 7 GB of GitHub's machines, and waits time out (CI of 2026-10-21). In series, about a minute on a Mac.
        env:
          MATCHA_XCODEBUILD_FLAGS: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGNING_REQUIRED=NO
          MATCHA_TEST_FLAGS: -parallel-testing-enabled NO
        run: scripts/check.sh

      - name: Journaux
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journaux
          path: |
            build/check
            build/Logs/Test
